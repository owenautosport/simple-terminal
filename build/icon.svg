<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a303c"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8cd7e"/>
      <stop offset="1" stop-color="#ec9f45"/>
    </linearGradient>
  </defs>

  <!-- app shell, sized to the macOS icon grid, with one hairline of light along the top -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shell)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- the grid: one tall pane you are working in, two quiet ones beside it -->
  <rect x="192" y="192" width="404" height="640" rx="56" fill="#0f1217"/>
  <rect x="628" y="192" width="204" height="304" rx="48" fill="#343b48"/>
  <rect x="628" y="528" width="204" height="304" rx="48" fill="#343b48"/>

  <!-- the prompt: the one detail that has to survive at 16px -->
  <polyline points="272,398 384,500 272,602" fill="none" stroke="url(#amber)" stroke-width="64"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="552" width="124" height="56" rx="20" fill="url(#amber)"/>
</svg>
